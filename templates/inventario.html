{% extends "base.html" %}

{% block content %}
<div class="p-3 sm:p-6 max-w-5xl mx-auto w-full space-y-4">

    <!-- Encabezado y Botón Nuevo -->
    <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <div>
            <h1 class="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="boxes" class="w-6 h-6 text-emerald-600"></i> Inventario de Productos
            </h1>
            <p class="text-xs text-slate-500">Gestiona los artículos, precios en USD y existencias.</p>
        </div>
        <button onclick="abrirModalNuevo()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-1.5 shadow-md transition shrink-0">
            <i data-lucide="plus" class="w-4 h-4"></i> Nuevo
        </button>
    </div>

    <!-- Tabla / Lista de Productos -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs sm:text-sm">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold uppercase tracking-wider text-[11px]">
                        <th class="p-3">Código</th>
                        <th class="p-3">Producto</th>
                        <th class="p-3 text-right">Precio ($)</th>
                        <th class="p-3 text-right">Precio (Bs)</th>
                        <th class="p-3 text-center">Stock</th>
                        <th class="p-3 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos" class="divide-y divide-slate-100 text-slate-700">
                    <!-- Se carga dinámicamente con JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Crear / Editar Producto -->
<div id="modal-producto" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 max-w-md w-full shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b pb-2 border-slate-100">
            <h3 id="modal-titulo" class="text-base font-bold text-slate-800">Nuevo Producto</h3>
            <button onclick="cerrarModal()" class="text-slate-400 hover:text-slate-600 p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <input type="hidden" id="p-id">

        <div class="space-y-3">
            <!-- Campo Código de Barras + Botón Escáner -->
            <div>
                <label class="text-xs font-bold text-slate-700">Código de Barras</label>
                <div class="flex gap-2 mt-1">
                    <input type="text" id="p-codigo" placeholder="Ej: 750123456789" 
                           class="flex-1 border border-slate-300 rounded-xl p-2.5 font-mono text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <button type="button" onclick="toggleEscanerInventario()" 
                            class="bg-slate-800 hover:bg-slate-700 text-emerald-400 px-3 py-2.5 rounded-xl flex items-center justify-center transition shadow-sm" 
                            title="Escanear con Cámara">
                        <i data-lucide="camera" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Contenedor del Escáner en vivo -->
                <div id="reader-container-inv" class="hidden mt-2 p-2 bg-slate-900 rounded-xl text-center space-y-2">
                    <div id="reader-inv" class="w-full rounded-lg overflow-hidden bg-black"></div>
                    <button type="button" onclick="detenerEscanerInventario()" class="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold">
                        Cancelar Escáner
                    </button>
                </div>
            </div>

            <div>
                <label class="text-xs font-bold text-slate-700">Nombre del Producto</label>
                <input type="text" id="p-nombre" placeholder="Ej: Harina PAN 1kg" 
                       class="w-full mt-1 border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-bold text-slate-700">Precio ($ USD)</label>
                    <input type="number" step="0.01" id="p-precio" placeholder="1.10" 
                           class="w-full mt-1 border border-slate-300 rounded-xl p-2.5 text-sm font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-700">Stock (Cant/Kg)</label>
                    <input type="number" step="0.01" id="p-stock" placeholder="50" 
                           class="w-full mt-1 border border-slate-300 rounded-xl p-2.5 text-sm font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
            <button onclick="cerrarModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold">Cancelar</button>
            <button onclick="guardarProducto()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md">Guardar</button>
        </div>
    </div>
</div>

<script>
    let html5QrcodeInv = null;

    async function cargarProductos() {
        const res = await fetch('/api/productos');
        const productos = await res.json();
        const tbody = document.getElementById('tabla-productos');
        tbody.innerHTML = '';

        productos.forEach(p => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-50 border-b border-slate-100';
            tr.innerHTML = `
                <td class="p-3 font-mono text-slate-500">${p.codigo_barras}</td>
                <td class="p-3 font-semibold text-slate-800">${p.nombre}</td>
                <td class="p-3 text-right font-bold text-slate-800">$${p.precio_usd.toFixed(2)}</td>
                <td class="p-3 text-right font-bold text-emerald-600">Bs. ${p.precio_local.toFixed(2)}</td>
                <td class="p-3 text-center">
                    <span class="px-2 py-1 rounded-lg text-xs font-bold ${p.stock < 5 ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-700'}">
                        ${p.stock}
                    </span>
                </td>
                <td class="p-3 text-center">
                    <div class="flex justify-center gap-1">
                        <button onclick='abrirModalEditar(${JSON.stringify(p)})' class="p-1.5 hover:bg-slate-200 rounded-lg text-slate-600" title="Editar">
                            <i data-lucide="edit-2" class="w-4 h-4"></i>
                        </button>
                        <button onclick="eliminarProducto(${p.id})" class="p-1.5 hover:bg-rose-100 rounded-lg text-rose-600" title="Eliminar">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
        lucide.createIcons();
    }

    function abrirModalNuevo() {
        document.getElementById('modal-titulo').innerText = "Nuevo Producto";
        document.getElementById('p-id').value = "";
        document.getElementById('p-codigo').value = "";
        document.getElementById('p-codigo').disabled = false;
        document.getElementById('p-nombre').value = "";
        document.getElementById('p-precio').value = "";
        document.getElementById('p-stock').value = "";
        document.getElementById('modal-producto').classList.remove('hidden');
    }

    function abrirModalEditar(p) {
        document.getElementById('modal-titulo').innerText = "Editar Producto";
        document.getElementById('p-id').value = p.id;
        document.getElementById('p-codigo').value = p.codigo_barras;
        document.getElementById('p-codigo').disabled = true; // El código no se edita para evitar choques
        document.getElementById('p-nombre').value = p.nombre;
        document.getElementById('p-precio').value = p.precio_usd;
        document.getElementById('p-stock').value = p.stock;
        document.getElementById('modal-producto').classList.remove('hidden');
    }

    async function cerrarModal() {
        await detenerEscanerInventario();
        document.getElementById('modal-producto').classList.add('hidden');
    }

    async function guardarProducto() {
        const id = document.getElementById('p-id').value;
        const codigo_barras = document.getElementById('p-codigo').value.trim();
        const nombre = document.getElementById('p-nombre').value.trim();
        const precio_usd = document.getElementById('p-precio').value;
        const stock = document.getElementById('p-stock').value;

        if (!codigo_barras || !nombre || !precio_usd || !stock) {
            return alert("Por favor completa todos los campos.");
        }

        const data = { id, codigo_barras, nombre, precio_usd, stock };
        const method = id ? 'PUT' : 'POST';

        const res = await fetch('/api/productos', {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            await cerrarModal();
            cargarProductos();
        } else {
            const err = await res.json();
            alert(err.error || "Error al guardar el producto");
        }
    }

    async function eliminarProducto(id) {
        if (!confirm("¿Deseas eliminar este producto del inventario?")) return;
        const res = await fetch(`/api/productos?id=${id}`, { method: 'DELETE' });
        if (res.ok) {
            cargarProductos();
        } else {
            alert("No se pudo eliminar el producto.");
        }
    }

    /* Lógica del Escáner de Cámara */
    async function toggleEscanerInventario() {
        const container = document.getElementById('reader-container-inv');
        if (container.classList.contains('hidden')) {
            container.classList.remove('hidden');
            html5QrcodeInv = new Html5Qrcode("reader-inv");
            try {
                await html5QrcodeInv.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 120 } },
                    (decodedText) => {
                        document.getElementById('p-codigo').value = decodedText;
                        detenerEscanerInventario();
                    },
                    () => {}
                );
            } catch (err) {
                alert("No se pudo iniciar la cámara: " + err);
                container.classList.add('hidden');
            }
        } else {
            detenerEscanerInventario();
        }
    }

    async function detenerEscanerInventario() {
        if (html5QrcodeInv) {
            try {
                await html5QrcodeInv.stop();
                html5QrcodeInv.clear();
            } catch(e) {}
            html5QrcodeInv = null;
        }
        document.getElementById('reader-container-inv').classList.add('hidden');
    }

    cargarProductos();
</script>
{% endblock %}
