{% extends 'base.html' %}
{% block content %}
<div class="flex-1 flex flex-col lg:flex-row overflow-y-auto lg:overflow-hidden">
    
    <div class="w-full lg:w-96 bg-white border-b lg:border-r border-slate-200 p-4 flex flex-col justify-between shrink-0 shadow-sm">
        <div>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="scan-barcode" class="text-emerald-600 w-5 h-5"></i> Escáner
                </h2>
                <button onclick="toggleCamera()" class="text-xs bg-slate-800 text-white px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1">
                    <i data-lucide="camera" class="w-3.5 h-3.5"></i> Cámara
                </button>
            </div>

            <div id="camera-wrapper" class="hidden mb-3 border-2 border-dashed border-emerald-500 rounded-xl overflow-hidden bg-black">
                <div id="reader" class="w-full"></div>
            </div>

            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 mb-3">
                <input type="text" id="barcode-input" autofocus autocomplete="off"
                       placeholder="Escanea o escribe código..."
                       class="w-full px-3 py-2 border rounded-lg text-base font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div id="last-scanned" class="hidden bg-emerald-50 border border-emerald-200 rounded-xl p-3">
                <span class="text-[10px] font-bold uppercase text-emerald-700">Último añadido:</span>
                <h3 id="last-title" class="text-sm font-bold text-slate-800 mt-0.5 truncate">---</h3>
                <div class="flex justify-between items-center mt-1">
                    <span id="last-code" class="text-xs font-mono text-slate-500">---</span>
                    <span id="last-price" class="text-base font-black text-emerald-600">$0.00</span>
                </div>
            </div>
        </div>

        <div class="border-t pt-3 space-y-3 mt-4">
            <div class="bg-slate-50 rounded-xl p-3 border space-y-1">
                <div class="flex justify-between text-xs text-slate-600">
                    <span>Líneas: <strong id="count-items" class="text-slate-800">0</strong></span>
                    <span>Artículos: <strong id="count-qty" class="text-slate-800">0</strong></span>
                </div>
                <div class="flex justify-between items-baseline pt-2 border-t">
                    <span class="text-sm font-bold">Total:</span>
                    <span id="total-price" class="text-2xl font-black text-emerald-600">$0.00</span>
                </div>
            </div>
            <button onclick="abrirConfirmacion()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-base shadow flex justify-center items-center gap-2">
                <i data-lucide="check-circle" class="w-5 h-5"></i> Despachar Venta
            </button>
        </div>
    </div>

    <div class="flex-1 p-4 bg-slate-100 overflow-x-auto">
        <div class="bg-white rounded-xl shadow-sm border h-full flex flex-col overflow-hidden">
            <div class="px-4 py-3 bg-slate-50 border-b flex justify-between items-center">
                <span class="font-bold text-slate-800 text-sm">Detalle de la Orden</span>
                <button onclick="vaciarCarrito()" class="text-xs text-rose-600 font-semibold">Vaciar</button>
            </div>
            <div class="flex-1 overflow-y-auto">
                <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead class="bg-slate-50 border-b text-[11px] uppercase font-bold text-slate-500">
                        <tr>
                            <th class="p-3">Código</th>
                            <th class="p-3">Producto</th>
                            <th class="p-3">Precio</th>
                            <th class="p-3 text-center">Cant/Kg</th>
                            <th class="p-3 text-right">Subtotal</th>
                            <th class="p-3 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cart-table" class="divide-y text-xs sm:text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="modal-confirm" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 max-w-md w-full shadow-2xl">
        <h3 class="text-lg font-bold mb-2">⚠️ Confirmar Despacho</h3>
        <div id="summary-list" class="max-h-48 overflow-y-auto my-3 border-y divide-y text-xs"></div>
        <div class="flex justify-between my-3 font-bold">
            <span>Total:</span>
            <span id="modal-total" class="text-emerald-600 text-xl"></span>
        </div>
        <div class="flex justify-end gap-2">
            <button onclick="cerrarModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-semibold">Cancelar</button>
            <button onclick="procesarVenta()" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Confirmar</button>
        </div>
    </div>
</div>

<script>
let carrito = {};
let html5QrcodeScanner = null;
const barcodeInput = document.getElementById('barcode-input');

barcodeInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        const code = barcodeInput.value.trim();
        barcodeInput.value = '';
        if (code) agregarPorCodigo(code);
    }
});

async function agregarPorCodigo(code) {
    if (carrito[code]) {
        carrito[code].cantidad += 1;
        renderTabla();
    } else {
        const res = await fetch(`/api/producto/${code}`);
        if (res.ok) {
            const prod = await res.json();
            carrito[code] = { id: prod.id, nombre: prod.nombre, precio: prod.precio, cantidad: 1 };
            renderTabla();
        } else {
            alert("❌ Producto no encontrado (" + code + ")");
        }
    }
}

function toggleCamera() {
    const wrapper = document.getElementById('camera-wrapper');
    if (wrapper.classList.contains('hidden')) {
        wrapper.classList.remove('hidden');
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 150 } },
            (decodedText) => {
                agregarPorCodigo(decodedText);
            }
        ).catch(err => alert("Error al abrir cámara: " + err));
    } else {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                wrapper.classList.add('hidden');
            });
        }
    }
}

function renderTabla() {
    const tbody = document.getElementById('cart-table');
    tbody.innerHTML = '';
    let total = 0, qty = 0;

    Object.keys(carrito).forEach(code => {
        const item = carrito[code];
        const sub = item.precio * item.cantidad;
        total += sub; qty += item.cantidad;

        tbody.innerHTML += `
            <tr class="hover:bg-slate-50">
                <td class="p-3 font-mono text-slate-500">${code}</td>
                <td class="p-3 font-semibold">${item.nombre}</td>
                <td class="p-3">$${item.precio.toFixed(2)}</td>
                <td class="p-3 text-center">
                    <input type="number" step="any" min="0.1" value="${item.cantidad}" onchange="actualizarCantidad('${code}', this.value)" class="w-16 border rounded text-center font-bold">
                </td>
                <td class="p-3 text-right font-bold">$${sub.toFixed(2)}</td>
                <td class="p-3 text-center">
                    <button onclick="eliminarProducto('${code}')" class="text-rose-600 font-bold">X</button>
                </td>
            </tr>
        `;
    });

    document.getElementById('total-price').innerText = `$${total.toFixed(2)}`;
    document.getElementById('count-items').innerText = Object.keys(carrito).length;
    document.getElementById('count-qty').innerText = qty;
}

function actualizarCantidad(code, val) {
    const v = parseFloat(val);
    if (v > 0) carrito[code].cantidad = v; else delete carrito[code];
    renderTabla();
}

function eliminarProducto(code) { delete carrito[code]; renderTabla(); }
function vaciarCarrito() { carrito = {}; renderTabla(); }

function abrirConfirmacion() {
    if (Object.keys(carrito).length === 0) return alert("Carrito vacío.");
    const sum = document.getElementById('summary-list');
    sum.innerHTML = '';
    let total = 0;
    Object.values(carrito).forEach(i => {
        const sub = i.precio * i.cantidad; total += sub;
        sum.innerHTML += `<div class="flex justify-between py-1"><span>${i.cantidad}x ${i.nombre}</span><span>$${sub.toFixed(2)}</span></div>`;
    });
    document.getElementById('modal-total').innerText = `$${total.toFixed(2)}`;
    document.getElementById('modal-confirm').classList.remove('hidden');
}

function cerrarModal() { document.getElementById('modal-confirm').classList.add('hidden'); }

async function procesarVenta() {
    const items = Object.values(carrito).map(i => ({ id: i.id, cantidad: i.cantidad, precio: i.precio }));
    const res = await fetch('/api/despachar', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ items })
    });
    if (res.ok) {
        alert("✅ Venta despachada con éxito");
        carrito = {}; renderTabla(); cerrarModal();
    } else {
        alert("Error al procesar la venta.");
    }
}
</script>
{% endblock %}
