{% extends 'base.html' %}
{% block content %}
<div class="p-3 sm:p-6 max-w-7xl mx-auto w-full space-y-4">

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
        <div>
            <h1 class="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="shopping-cart" class="w-6 h-6 text-emerald-600"></i> Punto de Venta (POS)
            </h1>
            <p class="text-xs text-slate-500">Facturación rápida, escáner e ingrefe manual.</p>
        </div>
        <div class="flex items-center gap-2 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200">
            <span class="text-xs text-emerald-700 font-medium">Tasa del día:</span>
            <span class="text-sm font-bold text-emerald-800" id="pos-tasa-badge">Bs. 0.00</span>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

        <div class="lg:col-span-7 space-y-4">

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                    <i data-lucide="search" class="w-4 h-4 text-emerald-600"></i> Buscar Producto (Nombre o Código)
                </label>
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                    <input type="text" id="pos-buscar-input" oninput="filtrarCatalogoPOS()" autocomplete="off"
                        placeholder="Escribe para buscar..." 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-800 focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                </div>

                <div id="pos-catalogo-resultados" class="max-h-56 overflow-y-auto divide-y divide-slate-100 text-xs hidden border border-slate-200 rounded-xl bg-white shadow-lg">
                    </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                    <i data-lucide="barcode" class="w-4 h-4 text-emerald-600"></i> Código de Barras Directo
                </label>
                <form id="form-escaner" onsubmit="buscarPorCodigo(event)" class="flex gap-2">
                    <input type="text" id="input-codigo" placeholder="Escanear o ingresar código..." autofocus required
                        class="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-800 font-mono focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                    <button type="submit" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs flex items-center gap-1 shadow-sm transition">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Añadir
                    </button>
                </form>
            </div>

            <div id="pos-alerta" class="hidden p-3 rounded-xl text-xs font-medium border"></div>

        </div>

        <div class="lg:col-span-5">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between h-full min-h-[400px]">
                
                <div class="space-y-3">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                            <i data-lucide="shopping-bag" class="w-4 h-4 text-emerald-600"></i> Orden Actual
                        </h2>
                        <button onclick="vaciarCarrito()" class="text-[11px] text-rose-600 hover:underline font-semibold flex items-center gap-1">
                            <i data-lucide="trash-2" class="w-3 h-3"></i> Vaciar
                        </button>
                    </div>

                    <div class="overflow-x-auto max-h-64 overflow-y-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="text-slate-400 font-bold border-b border-slate-100 uppercase text-[10px]">
                                    <th class="py-2">Item</th>
                                    <th class="py-2 text-center">Cant.</th>
                                    <th class="py-2 text-right">Precio</th>
                                    <th class="py-2 text-right"></th>
                                </tr>
                            </thead>
                            <tbody id="carrito-body" class="divide-y divide-slate-100 text-slate-700">
                                </tbody>
                        </table>
                        <div id="carrito-vacio-msg" class="text-center py-8 text-slate-400 text-xs">
                            El carrito está vacío
                        </div>
                    </div>
                </div>

                <div class="border-t border-slate-100 pt-3 space-y-3 mt-4">
                    <div class="space-y-1 text-xs">
                        <div class="flex justify-between text-slate-500">
                            <span>Subtotal USD:</span>
                            <span id="total-usd-txt" class="font-bold text-slate-800">$0.00</span>
                        </div>
                        <div class="flex justify-between text-slate-800 text-sm font-bold pt-1 border-t border-dashed border-slate-200">
                            <span class="text-emerald-700">Total Bs:</span>
                            <span id="total-local-txt" class="text-emerald-700 text-base font-black">Bs. 0.00</span>
                        </div>
                    </div>

                    <button id="btn-despachar" onclick="procesarVenta()" disabled
                        class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-xl text-xs sm:text-sm flex justify-center items-center gap-2 shadow-md transition">
                        <i data-lucide="check-circle" class="w-4 h-4"></i> Procesar Venta
                    </button>
                </div>

            </div>
        </div>

    </div>
</div>

<script>
let carrito = [];
let tasaActual = 1.0;
let catalogoPOS = [];

// Cargar tasa y catálogo inicial al abrir la vista
async function inicializarPOS() {
    try {
        const resTasa = await fetch('/api/tasa');
        const dataTasa = await resTasa.json();
        tasaActual = dataTasa.tasa;
        document.getElementById('pos-tasa-badge').innerText = `Bs. ${tasaActual.toFixed(2)}`;

        const resProds = await fetch('/api/productos');
        catalogoPOS = await resProds.json();
    } catch (e) {
        mostrarAlerta("Error al conectar con el servidor", "error");
    }
}

// Búsqueda por código exacto o escáner
async function buscarPorCodigo(e) {
    e.preventDefault();
    const input = document.getElementById('input-codigo');
    const codigo = input.value.trim();
    if (!codigo) return;

    try {
        const res = await fetch(`/api/producto/${codigo}`);
        if (res.ok) {
            const prod = await res.json();
            agregarAlCarrito(prod);
            input.value = '';
            ocultarAlerta();
        } else {
            mostrarAlerta("Producto no encontrado en inventario", "error");
        }
    } catch (err) {
        mostrarAlerta("Error al buscar producto", "error");
    }
}

// Filtrar catálogo por nombre o código en el input de búsqueda
function filtrarCatalogoPOS() {
    const q = document.getElementById('pos-buscar-input').value.toLowerCase().trim();
    const contenedor = document.getElementById('pos-catalogo-resultados');
    
    if (!q) {
        contenedor.classList.add('hidden');
        contenedor.innerHTML = '';
        return;
    }

    const coincidencias = catalogoPOS.filter(p => 
        p.nombre.toLowerCase().includes(q) || 
        p.codigo_barras.toLowerCase().includes(q)
    );

    if (coincidencias.length === 0) {
        contenedor.innerHTML = `<div class="p-3 text-center text-slate-400">No se encontraron coincidencias</div>`;
        contenedor.classList.remove('hidden');
        return;
    }

    contenedor.innerHTML = coincidencias.map(p => `
        <div onclick="seleccionarDesdeBuscador(${p.id})" class="p-2.5 hover:bg-emerald-50 cursor-pointer flex justify-between items-center transition">
            <div>
                <div class="font-bold text-slate-800">${p.nombre}</div>
                <div class="text-[10px] text-slate-400 font-mono">${p.codigo_barras} | Stock: ${p.stock}</div>
            </div>
            <div class="text-right">
                <div class="font-black text-emerald-600">$${p.precio_usd.toFixed(2)}</div>
                <div class="text-[10px] text-slate-500">Bs. ${p.precio_local.toFixed(2)}</div>
            </div>
        </div>
    `).join('');
    
    contenedor.classList.remove('hidden');
}

function seleccionarDesdeBuscador(prodId) {
    const prod = catalogoPOS.find(p => p.id === prodId);
    if (prod) {
        agregarAlCarrito(prod);
        document.getElementById('pos-buscar-input').value = '';
        document.getElementById('pos-catalogo-resultados').classList.add('hidden');
    }
}

// Añadir elemento al carrito de compras
function agregarAlCarrito(prod) {
    const existe = carrito.find(item => item.id === prod.id);
    if (existe) {
        if (existe.cantidad + 1 > prod.stock) {
            mostrarAlerta(`Stock insuficiente. Disponible: ${prod.stock}`, "error");
            return;
        }
        existe.cantidad += 1;
    } else {
        if (prod.stock < 1) {
            mostrarAlerta("Producto sin stock disponible", "error");
            return;
        }
        carrito.push({
            id: prod.id,
            nombre: prod.nombre,
            precio_usd: prod.precio_usd,
            cantidad: 1,
            stock_max: prod.stock
        });
    }
    renderizarCarrito();
}

function cambiarCantidad(index, delta) {
    const item = carrito[index];
    const nuevaCant = item.cantidad + delta;

    if (nuevaCant <= 0) {
        carrito.splice(index, 1);
    } else if (nuevaCant > item.stock_max) {
        mostrarAlerta(`Stock máximo disponible: ${item.stock_max}`, "error");
        return;
    } else {
        item.cantidad = nuevaCant;
    }
    renderizarCarrito();
}

function vaciarCarrito() {
    carrito = [];
    renderizarCarrito();
}

function renderizarCarrito() {
    const tbody = document.getElementById('carrito-body');
    const msgVacio = document.getElementById('carrito-vacio-msg');
    const btnDespachar = document.getElementById('btn-despachar');

    tbody.innerHTML = '';

    if (carrito.length === 0) {
        msgVacio.classList.remove('hidden');
        btnDespachar.disabled = true;
        document.getElementById('total-usd-txt').innerText = '$0.00';
        document.getElementById('total-local-txt').innerText = 'Bs. 0.00';
        return;
    }

    msgVacio.classList.add('hidden');
    btnDespachar.disabled = false;

    let subtotalUsd = 0;

    carrito.forEach((item, index) => {
        const itemTotal = item.cantidad * item.precio_usd;
        subtotalUsd += itemTotal;

        const tr = document.createElement('tr');
        tr.className = 'border-b border-slate-100';
        tr.innerHTML = `
            <td class="py-2 font-semibold text-slate-800">${item.nombre}</td>
            <td class="py-2 text-center">
                <div class="inline-flex items-center gap-1 bg-slate-100 rounded-lg p-0.5">
                    <button onclick="cambiarCantidad(${index}, -1)" class="w-5 h-5 flex items-center justify-center text-slate-600 hover:bg-white rounded font-bold">-</button>
                    <span class="w-6 text-center font-bold text-slate-800 text-xs">${item.cantidad}</span>
                    <button onclick="cambiarCantidad(${index}, 1)" class="w-5 h-5 flex items-center justify-center text-slate-600 hover:bg-white rounded font-bold">+</button>
                </div>
            </td>
            <td class="py-2 text-right font-bold text-slate-700">$${itemTotal.toFixed(2)}</td>
            <td class="py-2 text-right">
                <button onclick="cambiarCantidad(${index}, -${item.cantidad})" class="text-rose-500 hover:text-rose-700">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            </td>
        `;
        tbody.appendChild(tr);
    });

    const totalLocal = subtotalUsd * tasaActual;
    document.getElementById('total-usd-txt').innerText = `$${subtotalUsd.toFixed(2)}`;
    document.getElementById('total-local-txt').innerText = `Bs. ${totalLocal.toFixed(2)}`;
    lucide.createIcons();
}

// Enviar datos al endpoint /api/despachar
async function procesarVenta() {
    if (carrito.length === 0) return;

    const btn = document.getElementById('btn-despachar');
    btn.disabled = true;
    btn.innerText = "Procesando...";

    try {
        const res = await fetch('/api/despachar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items: carrito })
        });

        const data = await res.json();

        if (res.ok) {
            mostrarAlerta(`¡Venta #${data.venta_id} registrada con éxito! Total: Bs. ${data.total_local}`, "exito");
            vaciarCarrito();
            inicializarPOS(); // Actualiza el catálogo local y stock
        } else {
            mostrarAlerta(data.error || "Error al procesar la venta", "error");
        }
    } catch (e) {
        mostrarAlerta("Error de conexión al despachar", "error");
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> Procesar Venta`;
        lucide.createIcons();
    }
}

function mostrarAlerta(msg, tipo) {
    const box = document.getElementById('pos-alerta');
    box.innerText = msg;
    box.classList.remove('hidden', 'bg-rose-50', 'text-rose-700', 'border-rose-200', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200');

    if (tipo === 'exito') {
        box.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
    } else {
        box.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-200');
    }
}

function ocultarAlerta() {
    document.getElementById('pos-alerta').classList.add('hidden');
}

inicializarPOS();
</script>
{% endblock %}
