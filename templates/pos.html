{% extends 'base.html' %}

{% block content %}
<!-- Librería Html5Qrcode para lectura de códigos con cámara -->
<script src="https://unpkg.com/html5-qrcode"></script>

<div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- PANEL IZQUIERDO: BÚSQUEDA Y CARRITO -->
    <div class="lg:col-span-8 space-y-4">
        
        <!-- Buscador con Cámara -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md flex gap-2">
            <div class="relative flex-1">
                <input type="text" id="barcode-input" placeholder="Escanea o escribe el código de barras..." 
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 font-mono"
                       onkeypress="if(event.key === 'Enter') buscarPorCodigoDirecto(this.value)">
                <i class="fa-solid fa-barcode absolute left-3 top-3.5 text-slate-500"></i>
            </div>
            
            <button type="button" onclick="iniciarEscanerPOS()" 
                    class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-3 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition"
                    title="Escanear con Cámara">
                <i class="fa-solid fa-camera"></i>
                <span class="hidden sm:inline">Cámara</span>
            </button>
        </div>

        <!-- Tabla del Carrito de Compras -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Carrito de Ventas</h2>
                <button onclick="vaciarCarrito()" class="text-red-400 hover:text-red-300 text-xs flex items-center gap-1">
                    <i class="fa-solid fa-trash-can"></i> Vaciar
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="tabla-carrito">
                    <thead>
                        <tr class="border-b border-slate-700 text-xs font-semibold text-slate-400 uppercase">
                            <th class="py-2 px-2">Producto</th>
                            <th class="py-2 px-2 text-center">Precio</th>
                            <th class="py-2 px-2 text-center">Cant.</th>
                            <th class="py-2 px-2 text-right">Subtotal</th>
                            <th class="py-2 px-2 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="carrito-body" class="divide-y divide-slate-700/50 text-sm">
                        <tr>
                            <td colspan="5" class="py-8 text-center text-slate-500">
                                El carrito está vacío. Escanea o busca un producto.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- PANEL DERECHO: RESUMEN Y DESPACHO -->
    <div class="lg:col-span-4 space-y-4">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-md space-y-6 sticky top-6">
            <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-calculator text-blue-400"></i> Resumen de Pago
            </h2>

            <!-- Selección de Cliente y Tipo de Pago -->
            <div class="space-y-4 border-t border-slate-700/60 pt-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Cliente</label>
                    <select id="select-cliente" onchange="verificarCredito()" 
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                        <option value="1">Cliente Genérico</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Condición de Pago</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="btn-pago-contado" onclick="setTipoPago(false)" 
                                class="py-2 px-3 rounded-lg text-xs font-bold bg-green-600 text-white border border-green-500 transition">
                            <i class="fa-solid fa-money-bill-wave mr-1"></i> Contado
                        </button>
                        <button type="button" id="btn-pago-credito" onclick="setTipoPago(true)" 
                                class="py-2 px-3 rounded-lg text-xs font-bold bg-slate-700 text-slate-300 border border-slate-600 transition">
                            <i class="fa-solid fa-clock-rotate-left mr-1"></i> Crédito (Fiado)
                        </button>
                    </div>
                </div>
            </div>

            <!-- Totales -->
            <div class="space-y-3 border-t border-b border-slate-700/60 py-4">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">Total en USD:</span>
                    <span id="pos-total-usd" class="text-2xl font-black text-green-400">$0.00</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">Total en BS:</span>
                    <span id="pos-total-bs" class="text-xl font-bold text-blue-400">0.00 BS</span>
                </div>
            </div>

            <button type="button" onclick="procesarVentaPOS()" id="btn-procesar"
                    class="w-full bg-green-600 hover:bg-green-500 text-white font-extrabold py-3.5 px-4 rounded-xl text-base transition flex items-center justify-center gap-2 shadow-lg shadow-green-900/20">
                <i class="fa-solid fa-check-circle"></i> Procesar Venta
            </button>
        </div>
    </div>

</div>

<!-- MODAL CÁMARA ESCÁNER PARA EL POS -->
<div id="modal-escaner-pos" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 w-full max-w-sm text-center shadow-2xl">
        <h3 class="text-white font-bold text-base mb-1">Escaneando Producto</h3>
        <p class="text-xs text-slate-400 mb-4">Apunta la cámara al código de barras.</p>
        
        <div id="reader-pos" class="w-full overflow-hidden rounded-xl bg-black border border-slate-600"></div>

        <button type="button" onclick="detenerEscanerPOS()" 
                class="mt-4 bg-red-600 hover:bg-red-500 text-white font-semibold px-4 py-2.5 rounded-xl text-xs w-full transition">
            <i class="fa-solid fa-xmark mr-1"></i> Cerrar Cámara
        </button>
    </div>
</div>

<script>
    const TASA = 36.50;
    let carrito = [];
    let esCredito = false;
    let html5QrcodeScannerPOS = null;

    async function cargarClientesPOS() {
        try {
            const res = await fetch('/api/clientes');
            const clientes = await res.json();
            const select = document.getElementById('select-cliente');
            
            select.innerHTML = clientes.map(c => 
                `<option value="${c.id}">${c.nombre} ${c.deuda_usd > 0 ? `(Debe: $${c.deuda_usd.toFixed(2)})` : ''}</option>`
            ).join('');
        } catch (e) {
            console.error('Error al cargar clientes:', e);
        }
    }

    function setTipoPago(credito) {
        const clienteId = document.getElementById('select-cliente').value;
        if (credito && clienteId === "1") {
            alert("No le puedes fiar al Cliente Genérico. Selecciona un cliente registrado.");
            return;
        }
        
        esCredito = credito;
        const btnContado = document.getElementById('btn-pago-contado');
        const btnCredito = document.getElementById('btn-pago-credito');

        if (esCredito) {
            btnCredito.className = "py-2 px-3 rounded-lg text-xs font-bold bg-amber-600 text-white border border-amber-500 transition";
            btnContado.className = "py-2 px-3 rounded-lg text-xs font-bold bg-slate-700 text-slate-300 border border-slate-600 transition";
        } else {
            btnContado.className = "py-2 px-3 rounded-lg text-xs font-bold bg-green-600 text-white border border-green-500 transition";
            btnCredito.className = "py-2 px-3 rounded-lg text-xs font-bold bg-slate-700 text-slate-300 border border-slate-600 transition";
        }
    }

    function verificarCredito() {
        const clienteId = document.getElementById('select-cliente').value;
        if (clienteId === "1" && esCredito) {
            setTipoPago(false);
        }
    }

    async function buscarPorCodigoDirecto(codigo) {
        const cod = codigo.trim();
        if (!cod) return;

        try {
            const res = await fetch(`/api/producto/${cod}`);
            if (res.ok) {
                const prod = await res.json();
                agregarAlCarrito(prod);
                document.getElementById('barcode-input').value = '';
            } else {
                alert(`Producto con código "${cod}" no encontrado.`);
            }
        } catch (e) {
            alert('Error de conexión al buscar producto.');
        }
    }

    function iniciarEscanerPOS() {
        document.getElementById('modal-escaner-pos').classList.remove('hidden');
        
        html5QrcodeScannerPOS = new Html5Qrcode("reader-pos");
        const config = { fps: 15, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 };

        html5QrcodeScannerPOS.start(
            { facingMode: "environment" },
            config,
            async (decodedText) => {
                await buscarPorCodigoDirecto(decodedText);
            },
            (errorMessage) => {}
        ).catch(err => {
            alert("No se pudo acceder a la cámara. Verifica los permisos del navegador.");
            detenerEscanerPOS();
        });
    }

    function detenerEscanerPOS() {
        if (html5QrcodeScannerPOS) {
            html5QrcodeScannerPOS.stop().then(() => {
                html5QrcodeScannerPOS.clear();
                document.getElementById('modal-escaner-pos').classList.add('hidden');
            }).catch(() => {
                document.getElementById('modal-escaner-pos').classList.add('hidden');
            });
        } else {
            document.getElementById('modal-escaner-pos').classList.add('hidden');
        }
    }

    function agregarAlCarrito(prod) {
        const itemExistente = carrito.find(i => i.id === prod.id);

        if (itemExistente) {
            if (itemExistente.cantidad + 1 > prod.stock) {
                alert(`No hay suficiente stock. Disponible: ${prod.stock}`);
                return;
            }
            itemExistente.cantidad += 1;
        } else {
            if (prod.stock < 1) {
                alert(`El producto "${prod.nombre}" está agotado.`);
                return;
            }
            carrito.push({
                id: prod.id,
                nombre: prod.nombre,
                precio: prod.precio,
                stock: prod.stock,
                cantidad: 1
            });
        }

        renderizarCarrito();
    }

    function cambiarCantidad(index, cambio) {
        const item = carrito[index];
        const nuevaCantidad = item.cantidad + cambio;

        if (nuevaCantidad <= 0) {
            eliminarDelCarrito(index);
            return;
        }

        if (nuevaCantidad > item.stock) {
            alert(`Stock máximo alcanzado (${item.stock} disponibles).`);
            return;
        }

        item.cantidad = nuevaCantidad;
        renderizarCarrito();
    }

    function eliminarDelCarrito(index) {
        carrito.splice(index, 1);
        renderizarCarrito();
    }

    function vaciarCarrito() {
        carrito = [];
        renderizarCarrito();
    }

    function renderizarCarrito() {
        const tbody = document.getElementById('carrito-body');

        if (carrito.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="py-8 text-center text-slate-500">
                        El carrito está vacío. Escanea o busca un producto.
                    </td>
                </tr>`;
            document.getElementById('pos-total-usd').innerText = '$0.00';
            document.getElementById('pos-total-bs').innerText = '0.00 BS';
            return;
        }

        let totalUSD = 0;

        tbody.innerHTML = carrito.map((item, index) => {
            const subtotal = item.precio * item.cantidad;
            totalUSD += subtotal;

            return `
                <tr class="hover:bg-slate-700/30 transition">
                    <td class="py-3 px-2 font-medium text-white">${item.nombre}</td>
                    <td class="py-3 px-2 text-center text-slate-300">$${item.precio.toFixed(2)}</td>
                    <td class="py-3 px-2 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="cambiarCantidad(${index}, -1)" class="w-6 h-6 bg-slate-700 hover:bg-slate-600 rounded text-slate-200 font-bold flex items-center justify-center">-</button>
                            <span class="font-bold text-white w-6 text-center">${item.cantidad}</span>
                            <button onclick="cambiarCantidad(${index}, 1)" class="w-6 h-6 bg-slate-700 hover:bg-slate-600 rounded text-slate-200 font-bold flex items-center justify-center">+</button>
                        </div>
                    </td>
                    <td class="py-3 px-2 text-right font-bold text-green-400">$${subtotal.toFixed(2)}</td>
                    <td class="py-3 px-2 text-center">
                        <button onclick="eliminarDelCarrito(${index})" class="text-red-400 hover:text-red-300">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </td>
                </tr>
            `;
        }).join('');

        document.getElementById('pos-total-usd').innerText = `$${totalUSD.toFixed(2)}`;
        document.getElementById('pos-total-bs').innerText = `${(totalUSD * TASA).toFixed(2)} BS`;
    }

    async function procesarVentaPOS() {
        if (carrito.length === 0) {
            alert('El carrito está vacío.');
            return;
        }

        const clienteId = document.getElementById('select-cliente').value;
        const btn = document.getElementById('btn-procesar');
        btn.disabled = true;
        btn.innerText = 'Procesando...';

        try {
            const res = await fetch('/api/ventas/procesar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    items: carrito,
                    cliente_id: clienteId,
                    es_credito: esCredito
                })
            });

            const data = await res.json();

            if (data.success) {
                alert(`¡Venta #${String(data.venta_id).padStart(5, '0')} procesada exitosamente!`);
                vaciarCarrito();
                cargarClientesPOS();
            } else {
                alert(data.message || 'Error al procesar la venta.');
            }
        } catch (e) {
            alert('Error de conexión con el servidor.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Procesar Venta';
        }
    }

    document.addEventListener('DOMContentLoaded', cargarClientesPOS);
</script>
{% endblock %}
