<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bodega POS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        /* Oculta la barra de scroll visual en el menú móvil */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col max-w-full overflow-x-hidden">

    <!-- Navbar Responsivo -->
    <header class="bg-slate-900 text-white px-3 py-2 shadow-md no-print flex flex-col sm:flex-row justify-between items-center gap-2 w-full">
        <div class="flex items-center justify-between w-full sm:w-auto gap-2">
            <div class="flex items-center gap-2">
                <div class="bg-emerald-500 p-1.5 rounded-lg text-slate-900">
                    <i data-lucide="store" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-base tracking-wide">Bodega POS</span>
            </div>

            <!-- Indicador de Tasa Global -->
            <button onclick="abrirModalTasa()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2.5 py-1 rounded-xl flex items-center gap-1.5 transition">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-emerald-400"></i>
                <span class="text-[11px] text-slate-300">Tasa:</span>
                <span id="nav-tasa-val" class="text-xs font-black text-emerald-400">Bs. 0.00</span>
            </button>
        </div>

        <!-- Menú deslizable horizontalmente en móviles -->
        <nav class="flex items-center gap-1.5 text-xs font-semibold w-full sm:w-auto overflow-x-auto no-scrollbar py-1">
            <a href="/" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 flex items-center gap-1 shrink-0 transition"><i data-lucide="shopping-cart" class="w-3.5 h-3.5"></i> POS</a>
            
            {% if current_user.role == 'admin' %}
            <a href="/inventario" class="px-2.5 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-800 flex items-center gap-1 shrink-0 transition"><i data-lucide="boxes" class="w-3.5 h-3.5"></i> Stock</a>
            <a href="/ventas" class="px-2.5 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-800 flex items-center gap-1 shrink-0 transition"><i data-lucide="receipt" class="w-3.5 h-3.5"></i> Ventas</a>
            <a href="/dashboard" class="px-2.5 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-800 flex items-center gap-1 shrink-0 transition"><i data-lucide="bar-chart-3" class="w-3.5 h-3.5"></i> Dashboard</a>
            <a href="/usuarios" class="px-2.5 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-800 flex items-center gap-1 shrink-0 transition"><i data-lucide="users" class="w-3.5 h-3.5"></i> Usuarios</a>
            {% endif %}

            <div class="border-l border-slate-700 pl-2 ml-1 flex items-center gap-1.5 shrink-0">
                <a href="/logout" title="Cerrar Sesión" class="p-1.5 bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white rounded-lg transition flex items-center gap-1">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </a>
            </div>
        </nav>
    </header>

    <main class="flex-1 flex flex-col w-full overflow-x-hidden p-2 sm:p-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Modal Cambio de Tasa -->
    <div id="modal-tasa" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl space-y-3">
            <div class="flex items-center gap-2 text-emerald-600">
                <i data-lucide="dollar-sign" class="w-6 h-6"></i>
                <h3 class="text-base font-bold text-slate-800">Actualizar Tasa del Día</h3>
            </div>
            <p class="text-xs text-slate-500">Ingresa el valor de cambio actual.</p>
            
            <div>
                <label class="text-xs font-bold text-slate-700">Monto Tasa (Bs)</label>
                <input type="number" step="any" id="input-nueva-tasa" placeholder="Ej: 36.50"
                       class="w-full mt-1 border border-slate-300 rounded-xl p-2.5 font-bold text-base focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="cerrarModalTasa()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold">Cancelar</button>
                <button onclick="guardarTasa()" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold shadow-md">Guardar Tasa</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let globalTasa = 1.0;

        async function cargarTasaGlobal() {
            try {
                const res = await fetch('/api/tasa');
                const data = await res.json();
                globalTasa = data.tasa;
                document.getElementById('nav-tasa-val').innerText = `Bs. ${globalTasa.toFixed(2)}`;
            } catch(e) {}
        }

        function abrirModalTasa() {
            document.getElementById('input-nueva-tasa').value = globalTasa;
            document.getElementById('modal-tasa').classList.remove('hidden');
        }

        function cerrarModalTasa() {
            document.getElementById('modal-tasa').classList.add('hidden');
        }

        async function guardarTasa() {
            const nueva = parseFloat(document.getElementById('input-nueva-tasa').value);
            if (!nueva || nueva <= 0) return alert("Ingresa un valor válido.");

            const res = await fetch('/api/tasa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tasa: nueva })
            });

            if (res.ok) {
                cerrarModalTasa();
                location.reload();
            } else {
                const err = await res.json();
                alert(err.error || "Error al actualizar la tasa");
            }
        }

        cargarTasaGlobal();
    </script>
</body>
</html>
