<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BodegaPOS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex flex-col font-sans text-slate-100 antialiased selection:bg-blue-500 selection:text-white">

    <!-- NAVBAR SUPERIOR -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo e Identidad -->
                <div class="flex items-center gap-3">
                    <a href="{{ url_for('pos_view') }}" class="flex items-center gap-2.5 group">
                        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-600/30">
                            <i class="fa-solid fa-store"></i>
                        </div>
                        <span class="font-black text-lg text-white">Bodega<span class="text-blue-500">POS</span></span>
                    </a>
                </div>

                <!-- Menú de Escritorio -->
                <div class="hidden md:flex items-center gap-1">
                    <a href="{{ url_for('pos_view') }}" class="px-3 py-2 rounded-lg text-xs font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition">POS</a>
                    <a href="{{ url_for('inventario_view') }}" class="px-3 py-2 rounded-lg text-xs font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition">Inventario</a>
                    <a href="{{ url_for('clientes_view') }}" class="px-3 py-2 rounded-lg text-xs font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition">Clientes</a>
                    <a href="{{ url_for('dashboard_view') }}" class="px-3 py-2 rounded-lg text-xs font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition">Dashboard</a>
                    <a href="{{ url_for('usuarios_view') }}" class="px-3 py-2 rounded-lg text-xs font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition">Usuarios</a>
                </div>

                <!-- Botón Menú Hamburguesa Móvil -->
                <div class="flex items-center md:hidden">
                    <button type="button" onclick="toggleMenuMovil()" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Menú Desplegable Móvil -->
        <div id="menu-movil" class="hidden md:hidden bg-slate-900 border-b border-slate-800 px-4 pt-2 pb-4 space-y-1 shadow-xl">
            <a href="{{ url_for('pos_view') }}" class="block px-3 py-3 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-800">POS</a>
            <a href="{{ url_for('inventario_view') }}" class="block px-3 py-3 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-800">Inventario</a>
            <a href="{{ url_for('clientes_view') }}" class="block px-3 py-3 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-800">Clientes</a>
            <a href="{{ url_for('dashboard_view') }}" class="block px-3 py-3 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-800">Dashboard</a>
            <a href="{{ url_for('usuarios_view') }}" class="block px-3 py-3 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-800">Usuarios</a>
            
            {% if current_user is defined and current_user.is_authenticated %}
                <div class="pt-4 mt-2 border-t border-slate-800 flex items-center justify-between px-3">
                    <div>
                        <span class="block text-xs font-bold text-white">{{ current_user.nombre }}</span>
                    </div>
                    <a href="{{ url_for('logout') }}" class="bg-red-600/20 text-red-400 px-3 py-1.5 rounded-lg text-xs font-bold border border-red-500/30">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i> Salir
                    </a>
                </div>
            {% endif %}
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <script>
        function toggleMenuMovil() {
            document.getElementById('menu-movil').classList.toggle('hidden');
        }
    </script>
</body>
</html>
