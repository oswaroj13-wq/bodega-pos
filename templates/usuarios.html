{% extends 'base.html' %}
{% block content %}
<div class="p-4 max-w-5xl mx-auto w-full space-y-4">
    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border">
        <h2 class="text-lg font-bold flex items-center gap-2 text-slate-800">
            <i data-lucide="users" class="text-emerald-600"></i> Gestión de Usuarios
        </h2>
        <button onclick="abrirModalNuevoUser()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs sm:text-sm flex items-center gap-1 shadow">
            <i data-lucide="user-plus" class="w-4 h-4"></i> Nuevo Usuario
        </button>
    </div>

    <div class="bg-white rounded-xl shadow-sm border overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead class="bg-slate-50 border-b text-xs uppercase font-bold text-slate-500">
                <tr>
                    <th class="p-3">ID</th>
                    <th class="p-3">Usuario</th>
                    <th class="p-3">Rol</th>
                    <th class="p-3 text-center">Acciones</th>
                </tr>
            </thead>
            <tbody id="users-table" class="divide-y text-sm"></tbody>
        </table>
    </div>
</div>

<div id="modal-user" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 max-w-md w-full shadow-2xl space-y-3">
        <h3 id="modal-user-title" class="text-base font-bold text-slate-800">Nuevo Usuario</h3>
        <input type="hidden" id="user-id">
        
        <div>
            <label class="text-xs font-bold text-slate-700">Nombre de Usuario</label>
            <input type="text" id="user-name" placeholder="Ej: pedro" class="w-full border rounded-xl p-2.5 text-sm mt-1 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <div>
            <label class="text-xs font-bold text-slate-700">Rol de Sistema</label>
            <select id="user-role" class="w-full border rounded-xl p-2.5 text-sm mt-1 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
                <option value="cajero">Cajero (Solo POS)</option>
                <option value="admin">Administrador (Acceso Total)</option>
            </select>
        </div>

        <div>
            <label class="text-xs font-bold text-slate-700">Contraseña</label>
            <input type="password" id="user-pass" placeholder="••••••••" class="w-full border rounded-xl p-2.5 text-sm mt-1 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <p id="pass-help" class="text-[10px] text-slate-400 mt-1 hidden">Deja en blanco si no deseas cambiar la contraseña actual.</p>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t">
            <button onclick="cerrarModalUser()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold">Cancelar</button>
            <button onclick="guardarUsuario()" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold shadow">Guardar</button>
        </div>
    </div>
</div>

<script>
async function cargarUsuarios() {
    const res = await fetch('/api/usuarios');
    const users = await res.json();
    const tbody = document.getElementById('users-table');
    tbody.innerHTML = '';

    users.forEach(u => {
        tbody.innerHTML += `
            <tr class="hover:bg-slate-50">
                <td class="p-3 font-mono text-slate-400 text-xs">#${u.id}</td>
                <td class="p-3 font-bold text-slate-800">${u.username}</td>
                <td class="p-3">
                    <span class="px-2 py-1 text-[10px] font-black rounded-lg uppercase ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">
                        ${u.role}
                    </span>
                </td>
                <td class="p-3 text-center flex justify-center gap-3">
                    <button onclick='editarUsuario(${JSON.stringify(u)})' class="text-blue-600 font-bold text-xs hover:underline flex items-center gap-1">
                        <i data-lucide="edit" class="w-3.5 h-3.5"></i> Editar / Clave
                    </button>
                    <button onclick="eliminarUsuario(${u.id})" class="text-rose-600 font-bold text-xs hover:underline flex items-center gap-1">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Eliminar
                    </button>
                </td>
            </tr>
        `;
    });
    lucide.createIcons();
}

function abrirModalNuevoUser() {
    document.getElementById('user-id').value = '';
    document.getElementById('user-name').value = '';
    document.getElementById('user-role').value = 'cajero';
    document.getElementById('user-pass').value = '';
    document.getElementById('user-pass').required = true;
    document.getElementById('pass-help').classList.add('hidden');
    document.getElementById('modal-user-title').innerText = 'Nuevo Usuario';
    document.getElementById('modal-user').classList.remove('hidden');
}

function editarUsuario(u) {
    document.getElementById('user-id').value = u.id;
    document.getElementById('user-name').value = u.username;
    document.getElementById('user-role').value = u.role;
    document.getElementById('user-pass').value = '';
    document.getElementById('user-pass').required = false;
    document.getElementById('pass-help').classList.remove('hidden');
    document.getElementById('modal-user-title').innerText = `Editar Usuario: ${u.username}`;
    document.getElementById('modal-user').classList.remove('hidden');
}

function cerrarModalUser() {
    document.getElementById('modal-user').classList.add('hidden');
}

async function guardarUsuario() {
    const id = document.getElementById('user-id').value;
    const username = document.getElementById('user-name').value.trim();
    const role = document.getElementById('user-role').value;
    const password = document.getElementById('user-pass').value;

    if (!username) return alert("El nombre de usuario es obligatorio.");
    if (!id && !password) return alert("Debes ingresar una contraseña para el nuevo usuario.");

    const data = { id, username, role, password };
    const method = id ? 'PUT' : 'POST';

    const res = await fetch('/api/usuarios', {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });

    if (res.ok) {
        cerrarModalUser();
        cargarUsuarios();
    } else {
        const err = await res.json();
        alert(err.error || "Error al procesar la solicitud");
    }
}

async function eliminarUsuario(id) {
    if (confirm("¿Estás seguro de que deseas eliminar este usuario?")) {
        const res = await fetch(`/api/usuarios?id=${id}`, { method: 'DELETE' });
        if (res.ok) {
            cargarUsuarios();
        } else {
            const err = await res.json();
            alert(err.error || "Error al eliminar");
        }
    }
}

cargarUsuarios();
</script>
{% endblock %}
